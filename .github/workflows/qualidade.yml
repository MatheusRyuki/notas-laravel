name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8099
      APP_CONFIG_CACHE: /tmp/notas-ci-config.php
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      SESSION_DRIVER: array
      SESSION_COOKIE: notas_session
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BCRYPT_ROUNDS: '4'
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, dom, xml, curl, zip
          coverage: none
          tools: composer:v2

      - name: Localizar cache de downloads do Composer
        id: composer-cache
        run: echo "diretorio=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Reutilizar downloads do Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.diretorio }}
          key: ${{ runner.os }}-php85-composer-${{ hashFiles('composer.lock') }}

      - name: Instalar e conferir dependências PHP
        run: |
          composer validate --strict
          composer install --prefer-dist --no-interaction --no-progress
          composer check-platform-reqs

      # Os testes HTTP renderizam Blade com @vite; precisam do manifest real.
      - name: Preparar Node.js para as views
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Compilar assets usados pelas views
        run: |
          npm ci
          npm run build

      - name: Preparar configuração descartável
        run: |
          cp .env.example .env
          echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"

      - name: Conferir formatação
        run: env -u APP_CONFIG_CACHE php vendor/bin/pint --test

      - name: Executar testes
        run: php vendor/bin/phpunit

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências e compilar
        run: |
          npm ci
          npm run build
